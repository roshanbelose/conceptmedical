<!DOCTYPE html>
<html lang="en">

<head>

<title>Concept Medical - Concept Classroom</title>

<meta http-equiv="Content-type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<style>

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Montserrat', sans-serif;
  background: #f4f6fb;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 16px;
}

.card {
  background: #ffffff;
  border: 1.5px solid #1c4ba4;
  border-radius: 12px;
  max-width: 480px;
  width: 100%;
  padding: 32px 28px 28px;
}

.coming-soon-badge {
  display: inline-block;
  background: #fef3c7;
  color: #92400e;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  border-radius: 20px;
  padding: 5px 14px;
  margin-bottom: 16px;
}

.card-title {
  font-size: 20px;
  font-weight: 700;
  color: #111827;
  margin-bottom: 10px;
  line-height: 1.3;
}

.card-description {
  font-size: 13.5px;
  color: #6b7280;
  line-height: 1.65;
  margin-bottom: 24px;
  font-weight: 400;
}

.form-group {
  margin-bottom: 14px;
}

input[type="text"],
input[type="email"] {
  width: 100%;
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  color: #374151;
  background: #ffffff;
  border: 1.5px solid #d1d5db;
  border-radius: 6px;
  padding: 11px 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  -webkit-appearance: none;
  appearance: none;
}

input[type="text"]::placeholder,
input[type="email"]::placeholder {
  color: #9ca3af;
}

input[type="text"]:focus,
input[type="email"]:focus {
  border-color: #1c4ba4;
  box-shadow: 0 0 0 3px rgba(28, 75, 164, 0.10);
}

.btn-submit {
  width: 100%;
  background: #1c3a7a;
  color: #ffffff;
  font-family: 'Montserrat', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.3px;
  border: none;
  border-radius: 6px;
  padding: 13px;
  cursor: pointer;
  margin-top: 4px;
  transition: background 0.2s, transform 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-submit:hover {
  background: #0d2d6b;
  transform: translateY(-1px);
}

.btn-submit:active {
  transform: translateY(0);
}

@media (max-width: 520px) {
  .card {
    padding: 24px 18px 22px;
  }

  .card-title {
    font-size: 17px;
  }
}

</style>

<script>
$(document).ready(function () {

  /* Auto-split Full Name into first_name / last_name on form submit */
  $('#classroomForm').on('submit', function () {
    var fullName = $.trim($('#full_name').val());
    var parts    = fullName.split(/\s+/);
    if (parts.length >= 2) {
      $('#first_name').val(parts.slice(0, -1).join(' '));
      $('#last_name').val(parts[parts.length - 1]);
    } else {
      $('#first_name').val('');
      $('#last_name').val(fullName);
    }
  });

});
</script>

</head>

<body>

<div class="card">

  <span class="coming-soon-badge">Coming Soon</span>

  <h2 class="card-title">Concept Classroom</h2>

  <p class="card-description">
    An education-first format connecting science, technique and applied
    learning for healthcare professionals. Register interest to receive
    updates at launch.
  </p>

  <form id="classroomForm"
        method="POST"
        action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8">

    <!-- Salesforce hidden fields -->
    <input type="hidden" name="oid"         value="00D5g000005VEmP">
    <input type="hidden" name="retURL"      value="https://www.conceptmedical.com/thank-you-for-connecting-with-concept-medical/">
    <input type="hidden" name="lead_source" value="Web">
    <input type="hidden" name="00NC6000000O0gt" value="Webform">
    <input type="hidden" name="event_name"  value="Concept Classroom">

    <!-- Populated by JS on submit -->
    <input type="hidden" id="first_name" name="first_name" value="">
    <input type="hidden" id="last_name"  name="last_name"  value="">

    <!-- Visible fields -->
    <div class="form-group">
      <input type="text"
             id="full_name"
             placeholder="Full name"
             autocomplete="name"
             required>
    </div>

    <div class="form-group">
      <input type="email"
             name="email"
             placeholder="Professional email"
             autocomplete="email"
             required>
    </div>

    <div class="form-group">
      <input type="text"
             name="company"
             placeholder="Specialty / Institution"
             required>
    </div>

    <button type="submit" class="btn-submit">
      Register Interest &nbsp;&rarr;
    </button>

  </form>

</div>

</body>
</html>
